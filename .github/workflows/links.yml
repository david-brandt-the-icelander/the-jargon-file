name: Links

# Weekly, and by hand: check the outside links again. Changes nothing; fails (and GitHub
# says so) when a link readers are sent to has broken, so someone can run
# `npm run links:check` and commit the result.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/check-links.js --ci
